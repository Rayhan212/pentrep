schema_version: 1

engagement:
  title: "Minimal Example Engagement"
  client:
    name: "Example Corp"
  testers:
    - name: "Alex Tester"
  start_date: 2026-11-02
  end_date: 2026-11-13
  scope:
    in_scope:
      - asset: "https://app.example.test"
        type: url
  methodology: "Black-box testing following the OWASP WSTG."

findings:
  - id: PT-001
    title: "Missing Security Headers"
    cvss_vector: "CVSS:3.0/AV:N/AC:H/PR:N/UI:R/S:U/C:L/I:N/A:N"
    affected_assets:
      - "https://app.example.test"
    description: "The application does not send a Content-Security-Policy header."
    impact: "Injected scripts are not mitigated by the browser."
    steps_to_reproduce:
      - "Request the home page and inspect the response headers."
    evidence:
      - type: http
        caption: "Response headers"
        content: |
          HTTP/1.1 200 OK
          Content-Type: text/html
    remediation: "Send a restrictive Content-Security-Policy header on every response."
