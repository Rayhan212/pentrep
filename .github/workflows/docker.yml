name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build, check and publish the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io on tags only
    env:
      LOCAL_TAG: pentrep:ci
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build --pull -t "$LOCAL_TAG" .

      - name: Image is at most 400 MB uncompressed (FR-61)
        run: |
          size=$(docker image inspect --format '{{.Size}}' "$LOCAL_TAG")
          echo "image size: $((size / 1024 / 1024)) MB"
          test "$size" -le $((400 * 1024 * 1024))

      - name: Runs as a non-root user in /work
        run: |
          test "$(docker run --rm --entrypoint id "$LOCAL_TAG" -u)" != "0"
          test "$(docker run --rm --entrypoint pwd "$LOCAL_TAG")" = "/work"

      - name: Smoke test (init + build writes HTML, Markdown and PDF)
        run: |
          mkdir smoke
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/smoke:/work" "$LOCAL_TAG" init
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/smoke:/work" "$LOCAL_TAG" build findings.yaml
          for ext in html md pdf; do test -s "smoke/report/pentest-report.$ext"; done
          ls -l smoke/report

      - name: Push to GHCR (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(docker run --rm "$LOCAL_TAG" --version | awk '{print $2}')
          # The git tag (v0.1.0-rc1, v0.1.0) must match the package version (0.1.0rc1, 0.1.0).
          tag_version=$(echo "${GITHUB_REF_NAME#v}" | tr -d '-')
          if [ "$version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pentrep"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$LOCAL_TAG" "$image:$version"
          docker push "$image:$version"
          # :latest only for final releases, not release candidates.
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            docker tag "$LOCAL_TAG" "$image:latest"
            docker push "$image:latest"
          fi
