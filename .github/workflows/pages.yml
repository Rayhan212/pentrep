name: Pages

# Builds the sample report from examples/ (HTML, PDF and Markdown) and publishes it with GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the sample report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Pango
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --no-dev
      - name: Build the report
        run: |
          uv run --no-dev pentrep build examples/findings.yaml -f all -o site
          for ext in html md pdf; do test -s "site/pentest-report.$ext"; done
      - name: Add an index page
        run: |
          version=$(uv run --no-dev pentrep --version)
          cat > site/index.html <<HTML
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>pentrep sample report</title>
          <style>body{font-family:system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem;line-height:1.5}</style>
          </head>
          <body>
          <h1>pentrep sample report</h1>
          <p>Generated by ${version} from <a href="https://github.com/${GITHUB_REPOSITORY}/blob/main/examples/findings.yaml">examples/findings.yaml</a>.
          Secrets in the evidence are redacted.</p>
          <ul>
          <li><a href="pentest-report.html">HTML report</a></li>
          <li><a href="pentest-report.pdf">PDF report</a></li>
          <li><a href="pentest-report.md">Markdown report</a></li>
          </ul>
          <p><a href="https://github.com/${GITHUB_REPOSITORY}">Source on GitHub</a></p>
          </body>
          </html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
