name: Release

# PyPI Trusted Publishing (FR-60): no API token is stored in the repository.
#   v0.1.0-rc1 (any v*-rc* tag) -> TestPyPI, GitHub environment "testpypi"
#   v0.1.0     (vX.Y.Z)         -> PyPI,     GitHub environment "pypi" (required reviewer)
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.check.outputs.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv build
      - name: Check the tag against the package version
        id: check
        run: |
          wheel=$(ls dist/*.whl)
          version=$(basename "$wheel" | cut -d- -f2)
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
            target=testpypi
          elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            target=pypi
          else
            echo "::error::tag $tag is neither vX.Y.Z nor vX.Y.Z-rcN"
            exit 1
          fi
          # v0.1.0-rc1 must build 0.1.0rc1; v0.1.0 must build 0.1.0.
          expected=$(echo "${tag#v}" | tr -d '-')
          if [ "$version" != "$expected" ]; then
            echo "::error::tag $tag does not match package version $version"
            exit 1
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "Publishing $version to $target"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: needs.build.outputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pentrep/
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: build
    if: needs.build.outputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pentrep/
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
